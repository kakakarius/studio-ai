<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1a1a24;
  --border: #ffffff0f;
  --border2: #ffffff18;
  --text: #e8e8f0;
  --muted: #6b6b80;
  --accent: #a855f7;
  --accent2: #7c3aed;
  --accent-glow: rgba(168,85,247,0.3);
}
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 56px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,15,0.85); backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
}
.logo {
  font-size: 18px; font-weight: 600;
  background: linear-gradient(135deg, #a855f7, #ec4899);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-right { display: flex; align-items: center; gap: 10px; }
.counter-badge {
  font-size: 12px; color: var(--muted);
  background: var(--surface2); border: 1px solid var(--border2);
  padding: 4px 10px; border-radius: 20px;
}
.counter-badge span { color: #c084fc; font-weight: 500; }

.container { max-width: 1360px; margin: 0 auto; padding: 0 20px; }

.creator-section { padding: 24px 0 20px; border-bottom: 1px solid var(--border); }
.creator-grid { display: grid; grid-template-columns: 220px 1fr 180px; gap: 16px; align-items: start; }

/* 업로드 */
.upload-card {
  background: var(--surface); border: 1.5px dashed var(--border2);
  border-radius: 14px; overflow: hidden; cursor: pointer;
  position: relative; aspect-ratio: 3/4;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: border-color 0.2s;
}
.upload-card:hover, .upload-card.drag-over { border-color: var(--accent); background: rgba(168,85,247,0.05); }
.upload-card input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-card img { width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0; display: none; background: #000; }
.upload-ph { text-align: center; color: var(--muted); font-size: 13px; z-index: 1; pointer-events: none; }
.upload-ph .icon { width: 44px; height: 44px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0 auto 8px; }
.upload-ph p { font-size: 11px; margin-top: 4px; opacity: 0.6; }

/* 카테고리 */
.cat-tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.cat-tab {
  padding: 5px 12px; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border2);
  font-size: 12px; color: var(--muted); cursor: pointer; font-family: inherit;
  transition: all 0.15s; white-space: nowrap;
}
.cat-tab:hover { color: var(--text); }
.cat-tab.on { background: linear-gradient(135deg, var(--accent2), var(--accent)); border-color: transparent; color: #fff; }

.preset-wrap { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 12px; min-height: 100px; }
.preset-grid { display: flex; flex-wrap: wrap; gap: 5px; }
.preset-btn {
  padding: 5px 11px; border-radius: 7px;
  background: var(--surface2); border: 1px solid var(--border);
  font-size: 12px; color: #888; cursor: pointer; font-family: inherit; transition: all 0.12s;
}
.preset-btn:hover { border-color: var(--accent); color: var(--text); }
.preset-btn.on { background: rgba(168,85,247,0.15); border-color: var(--accent); color: #c084fc; }

.prompt-area { margin-top: 10px; }
textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--border2);
  border-radius: 10px; padding: 10px 12px; color: var(--text);
  font-size: 13px; font-family: inherit; resize: none; min-height: 72px; line-height: 1.5;
  transition: border-color 0.15s;
}
textarea:focus { outline: none; border-color: var(--accent); }
::placeholder { color: var(--muted); }

/* 오른쪽 */
.creator-right { display: flex; flex-direction: column; gap: 8px; }
.batch-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.batch-btn {
  padding: 8px; border-radius: 8px; background: var(--surface);
  border: 1px solid var(--border2); color: var(--muted);
  font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.12s; text-align: center;
}
.batch-btn.on { background: rgba(168,85,247,0.15); border-color: var(--accent); color: #c084fc; }

.seed-row { display: flex; align-items: center; gap: 6px; }
.model-select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 6px; padding: 6px 8px; color: var(--text);
  font-size: 12px; font-family: inherit; margin-bottom: 8px; cursor: pointer;
}
.model-select:focus { outline: none; border-color: var(--accent); }
.seed-row label { font-size: 11px; color: var(--muted); white-space: nowrap; }
.seed-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 6px; padding: 5px 8px; color: var(--text); font-size: 11px; font-family: 'Inter', monospace;
}
.seed-input:focus { outline: none; border-color: var(--accent); }
.seed-rand {
  padding: 5px 8px; border-radius: 6px; background: var(--surface2);
  border: 1px solid var(--border2); color: var(--muted); font-size: 11px;
  cursor: pointer; font-family: inherit; transition: all 0.12s;
}
.seed-rand:hover { color: var(--text); }

.gen-btn {
  width: 100%; padding: 13px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border: none; color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 4px 20px var(--accent-glow); transition: opacity 0.15s, transform 0.1s;
}
.gen-btn:hover { opacity: 0.9; transform: translateY(-1px); }
.gen-btn:active { transform: translateY(0); }
.gen-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* 결과 */
.result-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.slot {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; min-height: 300px;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.slot img { width: 100%; display: block; cursor: zoom-in; border-radius: 14px; }
.slot-empty { color: var(--border2); font-size: 13px; }
.slot-status { font-size: 12px; color: var(--muted); padding: 12px; text-align: center; }
.slot-actions {
  position: absolute; bottom: 10px; left: 0; right: 0;
  display: none; justify-content: center; gap: 6px; padding: 0 10px;
}
.slot:hover .slot-actions { display: flex; }
.slot-btn {
  padding: 5px 12px; border-radius: 7px; font-size: 12px;
  cursor: pointer; font-family: inherit; backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.75); color: #ddd;
  transition: all 0.12s;
}
.slot-btn.primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); border-color: transparent; color: #fff; }
.slot-btn:hover { opacity: 0.85; }

/* 갤러리 */
.gallery-section { padding: 24px 0; }
.gallery-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.gallery-tabs { display: flex; }
.gallery-tab {
  padding: 6px 16px; background: none; border: 1px solid var(--border2);
  color: var(--muted); font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.12s;
}
.gallery-tab:first-child { border-radius: 8px 0 0 8px; }
.gallery-tab:last-child { border-radius: 0 8px 8px 0; border-left: none; }
.gallery-tab.on { background: rgba(168,85,247,0.15); border-color: var(--accent); color: #c084fc; }
.clear-btn {
  font-size: 12px; color: var(--muted); background: none;
  border: 1px solid var(--border2); padding: 4px 12px;
  border-radius: 6px; cursor: pointer; font-family: inherit; transition: all 0.12s;
}
.clear-btn:hover { color: #f87171; border-color: rgba(248,113,113,0.4); }

.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.gallery-item {
  border-radius: 10px; overflow: hidden; aspect-ratio: 2/3;
  background: var(--surface); border: 1px solid var(--border);
  position: relative; cursor: zoom-in;
}
.gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-item .fav-btn {
  position: absolute; top: 6px; right: 6px;
  background: rgba(0,0,0,0.6); border: none; color: #fff;
  width: 26px; height: 26px; border-radius: 50%; font-size: 13px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
}
.gallery-item:hover .fav-btn { opacity: 1; pointer-events: auto; }
.gallery-item.favorited .fav-btn { opacity: 1; pointer-events: auto; color: #f59e0b; }
.gallery-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 55%);
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
  display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; gap: 4px;
}
.gallery-item:hover .gallery-overlay { opacity: 1; pointer-events: auto; }
.gi-btn {
  width: 100%; padding: 5px 6px; border-radius: 5px; font-size: 11px;
  cursor: pointer; font-family: inherit; text-align: center;
  border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.5); color: #ddd;
}
.gi-btn.primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); border-color: transparent; color: #fff; }
.gi-btn.danger { color: #f87171; }

/* 히스토리 패널 */
.history-section { padding: 0 0 24px; }
.history-title { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.history-list { display: flex; flex-direction: column; gap: 6px; }
.history-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px;
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  transition: border-color 0.15s;
}
.history-item:hover { border-color: var(--accent); }
.history-thumb { width: 36px; height: 48px; border-radius: 5px; object-fit: cover; flex-shrink: 0; cursor: zoom-in; }
.history-info { flex: 1; min-width: 0; }
.history-tags { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.history-reuse {
  padding: 4px 10px; border-radius: 6px; background: rgba(168,85,247,0.15);
  border: 1px solid var(--accent); color: #c084fc; font-size: 11px;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}

/* 비교 뷰 */
.compare-section { padding: 0 0 24px; display: none; }
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.compare-slot { border-radius: 12px; overflow: hidden; aspect-ratio: 2/3; background: var(--surface); border: 1px solid var(--border); position: relative; }
.compare-slot img { width: 100%; height: 100%; object-fit: contain; }
.compare-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #ddd; font-size: 11px; padding: 3px 8px; border-radius: 4px; }

/* 줌 */
.zoom-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.96); z-index: 9999;
  align-items: center; justify-content: center; cursor: zoom-out;
}
.zoom-overlay.on { display: flex; }
.zoom-overlay img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 12px; }

/* 섹션 헤더 토글 */
.section-toggle {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; margin-bottom: 14px; user-select: none;
}
.section-toggle-title { font-size: 14px; font-weight: 500; color: var(--text); }
.section-toggle-arrow { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
.section-toggle.collapsed .section-toggle-arrow { transform: rotate(-90deg); }

/* 클립보드 안내 */
.paste-hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; }

.preset-btn { position: relative; }
.pose-tooltip {
  position: fixed;
  background: #1a1a2e;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 8px 12px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 9000;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  max-width: 200px;
}
.pose-tooltip .tip-label {
  font-size: 12px; color: #c084fc;
  font-weight: 500; margin-bottom: 3px;
}
.pose-tooltip .tip-desc {
  font-size: 11px; color: #aaa;
  line-height: 1.4;
  white-space: normal;
}
.pose-tooltip.on { opacity: 1; }

.slot-progress {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 3px; background: var(--border2);
}
.slot-progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent));
  width: 0%; transition: width 0.4s ease;
  border-radius: 0 3px 3px 0;
}
.slot-status-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; padding: 16px;
}
.slot-pct { font-size: 11px; color: var(--accent); font-weight: 500; }

/* 프롬프트 칩 */
.prompt-chips {
  display: flex; flex-wrap: wrap; gap: 5px;
  min-height: 32px; padding: 6px 10px;
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 10px 10px 0 0; border-bottom: none;
}
.chip {
  display: flex; align-items: center; gap: 4px;
  background: rgba(168,85,247,0.15); border: 1px solid var(--accent);
  border-radius: 20px; padding: 3px 8px 3px 10px;
  font-size: 11px; color: #c084fc;
}
.chip-x {
  background: none; border: none; color: #888;
  cursor: pointer; font-size: 13px; line-height: 1;
  padding: 0; display: flex; align-items: center;
}
.chip-x:hover { color: #f87171; }
.prompt-chips-empty { color: var(--muted); font-size: 12px; align-self: center; }
textarea#prompt { border-radius: 0 0 10px 10px; }

.preset-btn {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 6px 8px; position: relative;
}
.preset-thumb {
  width: 60px; height: 80px; object-fit: cover;
  border-radius: 5px; display: block;
  background: var(--surface2);
}
.preset-thumb-ph {
  width: 60px; height: 80px; border-radius: 5px;
  background: var(--surface2); border: 1px dashed var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--muted); cursor: pointer;
  transition: border-color 0.15s;
}
.preset-btn:hover .preset-thumb-ph { border-color: var(--accent); color: var(--accent); }
.preset-btn-label { font-size: 11px; text-align: center; line-height: 1.2; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preset-grid { gap: 8px; }
.preset-btn.add-tile .preset-thumb-ph { border-color: var(--accent2); color: var(--accent); font-size: 22px; }

.preset-del {
  position: absolute; top: 2px; right: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: rgba(0,0,0,0.7); color: #f87171; font-size: 11px;
  display: none; align-items: center; justify-content: center; line-height: 1;
}
.preset-btn:hover .preset-del { display: flex; }

.slot-gen-btn { padding: 9px; font-size: 13px; }

.preset-filter { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.preset-filter-chip {
  padding: 4px 11px; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border2);
  font-size: 11px; color: var(--muted); cursor: pointer; font-family: inherit;
  transition: all 0.15s;
}
.preset-filter-chip.on { background: linear-gradient(135deg, var(--accent2), var(--accent)); border-color: transparent; color: #fff; }
.preset-tag-label {
  position: absolute; bottom: 2px; left: 2px;
  background: rgba(0,0,0,0.65); color: #c084fc; font-size: 9px;
  padding: 1px 5px; border-radius: 4px; pointer-events: none;
}

.save-as-preset-btn {
  width: 100%; margin-top: 6px; padding: 8px; border-radius: 8px;
  background: rgba(168,85,247,0.12); border: 1px dashed var(--accent);
  color: #c084fc; font-size: 12px; cursor: pointer; font-family: inherit;
  transition: all 0.15s;
}
.save-as-preset-btn:hover { background: rgba(168,85,247,0.2); }

/* 프리셋 추가 모달 */
.preset-modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 9999; align-items: center; justify-content: center;
}
.preset-modal-overlay.on { display: flex; }
.preset-modal {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 14px; padding: 20px; width: 280px;
  display: flex; flex-direction: column; gap: 6px;
}
.preset-modal-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.pm-label { font-size: 12px; color: var(--muted); margin-top: 6px; }
.pm-input, .pm-textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 8px; padding: 8px 10px; color: var(--text);
  font-size: 13px; font-family: inherit;
}
.pm-textarea { min-height: 60px; resize: none; line-height: 1.4; }
.pm-input:focus, .pm-textarea:focus { outline: none; border-color: var(--accent); }
.pm-thumb-upload { cursor: pointer; margin-top: 2px; }
.pm-actions { display: flex; gap: 8px; margin-top: 14px; }
.pm-btn {
  flex: 1; padding: 9px; border-radius: 8px; background: var(--surface2);
  border: 1px solid var(--border2); color: var(--text); font-size: 13px;
  cursor: pointer; font-family: inherit;
}
.pm-btn.primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); border-color: transparent; color: #fff; }
</style>
</head>
<body>

<div class="pose-tooltip" id="poseTooltip"><div class="tip-label" id="tooltipLabel"></div><div class="tip-desc" id="tooltipDesc"></div></div>
<div class="zoom-overlay" id="zoomOverlay" onclick="closeZoom()">
  <img id="zoomImg" src="">
</div>

<div class="preset-modal-overlay" id="presetModal" onclick="closePresetForm()">
  <div class="preset-modal" onclick="event.stopPropagation()">
    <div class="preset-modal-title">프리셋 추가</div>
    <label class="pm-label">이름</label>
    <input type="text" id="presetFormName" class="pm-input" placeholder="예: 손 허리">
    <label class="pm-label">태그 (분류, 선택사항)</label>
    <input type="text" id="presetFormCategory" class="pm-input" placeholder="예: 외모 / 포즈 / 의상">
    <label class="pm-label">프롬프트 (생성용 태그)</label>
    <textarea id="presetFormTag" class="pm-textarea" placeholder="예: standing with hands on hips, full body shot"></textarea>
    <label class="pm-label">썸네일</label>
    <div class="pm-thumb-upload" onclick="$('presetFormThumbInput').click()">
      <input type="file" id="presetFormThumbInput" accept="image/*" style="display:none" onchange="loadPresetThumb(this)">
      <div class="preset-thumb-ph" id="presetFormThumbPh">＋</div>
      <img id="presetFormThumbPreview" class="preset-thumb" style="display:none">
    </div>
    <div class="pm-actions">
      <button class="pm-btn" onclick="closePresetForm()">취소</button>
      <button class="pm-btn primary" onclick="savePreset()">저장</button>
    </div>
  </div>
</div>

<header>
  <div class="logo">Studio AI</div>
  <div class="header-right">
    <div class="counter-badge" ondblclick="resetGenCount()" title="더블클릭하면 초기화">생성 횟수 <span id="genCount">0</span></div>
    <div class="counter-badge" id="modelBadge">Seedream 5.0 Pro</div>
  </div>
</header>

<div class="container">
  <div class="creator-section">
    <div class="creator-grid">
      <!-- 업로드 -->
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="upload-card" id="faceBox0">
          <input type="file" accept="image/*" onchange="loadImg(this,0)">
          <div class="upload-ph" id="uploadPh0">
            <div class="icon">＋</div>
            <strong>이미지 1</strong>
            <p>클릭 · 드래그 · Ctrl+V</p>
          </div>
          <img id="facePreview0">
        </div>
        <button class="gen-btn slot-gen-btn" id="genBtn0" onclick="generateSlot(0)">✦ 생성 1</button>
        <div class="upload-card" id="faceBox1">
          <input type="file" accept="image/*" onchange="loadImg(this,1)">
          <div class="upload-ph" id="uploadPh1">
            <div class="icon">＋</div>
            <strong>이미지 2</strong>
            <p>선택사항</p>
          </div>
          <img id="facePreview1">
        </div>
        <button class="gen-btn slot-gen-btn" id="genBtn1" onclick="generateSlot(1)">✦ 생성 2</button>
        <div class="paste-hint">Ctrl+V로도 업로드 가능</div>
      </div>

      <!-- 중앙 -->
      <div>
        <div class="preset-filter" id="presetFilter"></div>
        <div class="preset-wrap">
          <div class="preset-grid" id="presets"></div>
        </div>
        <div class="prompt-area">
          <div class="prompt-chips" id="promptChips">
            <span class="prompt-chips-empty" id="chipsEmpty">선택된 태그 없음</span>
          </div>
          <textarea id="prompt" placeholder="직접 입력 (선택사항)" style="min-height:50px"></textarea>
          <button class="save-as-preset-btn" onclick="openPresetForm(true)">✦ 지금 이 프롬프트/결과를 프리셋으로 저장</button>
        </div>
      </div>

      <!-- 오른쪽 -->
      <div class="creator-right">

        <select class="model-select" id="modelSelect" onchange="onModelChange()"></select>
        <div class="seed-row">
          <label>시드</label>
          <input type="text" class="seed-input" id="seedInput" placeholder="랜덤">
          <button class="seed-rand" onclick="randomSeed()">🎲</button>
        </div>
        <button class="gen-btn" id="genBtnBoth" onclick="generateBoth()">✦ 둘 다 생성</button>
      </div>
    </div>

    <!-- 결과 + 비교 -->
    <div class="result-row" id="resultRow">
      <div class="slot" id="slot0"><div class="slot-empty">—</div></div>
      <div class="slot" id="slot1"><div class="slot-empty">—</div></div>
    </div>

    <!-- 비교 뷰 -->
    <div class="compare-section" id="compareSection">
      <div class="compare-grid">
        <div class="compare-slot">
          <img id="compareOriginal">
          <div class="compare-label">원본</div>
        </div>
        <div class="compare-slot">
          <img id="compareResult">
          <div class="compare-label">생성</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 히스토리 -->
  <div class="history-section" id="historySection" style="padding-top:24px">
    <div class="section-toggle" onclick="toggleSection('history')">
      <div class="section-toggle-title">생성 히스토리</div>
      <div class="section-toggle-arrow" id="history-arrow">▾</div>
    </div>
    <div id="history-body">
      <div class="history-list" id="historyList">
        <div style="color:var(--muted);font-size:13px">히스토리가 없습니다</div>
      </div>
    </div>
  </div>

  <!-- 갤러리 -->
  <div class="gallery-section">
    <div class="gallery-header">
      <div class="gallery-tabs">
        <button class="gallery-tab on" onclick="switchGallery('saved')" id="gtab-saved">저장됨</button>
        <button class="gallery-tab" onclick="switchGallery('session')" id="gtab-session">이번 세션</button>
        <button class="gallery-tab" onclick="switchGallery('favorites')" id="gtab-favorites">즐겨찾기 ⭐</button>
      </div>
      <button class="clear-btn" onclick="clearSaved()">전체 삭제</button>
    </div>
    <div class="gallery-grid" id="savedGrid"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const API_KEY = 'sk-fjtr6ko9e7DsTyWiap7LZcvDJFNONclstzI06Ef0flv5LJRv';

const MODELS = {
  seedream: { id: 'bytedance/seedream-5.0-pro-i2i-spicy', label: 'Seedream 5.0 Pro (i2i)', needsImage: true },
  zimage:   { id: 'alibaba/z-image-spicy-pro-t2i', label: 'Z-Image Spicy Pro (t2i)', needsImage: false },
};
let selectedModel = localStorage.getItem('selectedModel') || 'seedream';
if (!MODELS[selectedModel]) selectedModel = 'seedream';


let selectedTags = new Set(), faceDataUrls = [null, null];
let customPresets = JSON.parse(localStorage.getItem('customPresets') || '[]');
let presetThumbData = null;
let presetFilter = '전체';
let genCount = parseInt(localStorage.getItem('genCount') || '0');
// 기존에 문자열 배열(url만)로 저장돼 있던 데이터도 {url, prompt} 형태로 자연스럽게 승격
function migrateGalleryEntries(arr) {
  return arr.map(item => typeof item === 'string' ? { url: item, prompt: '' } : item);
}
let savedImages = migrateGalleryEntries(JSON.parse(localStorage.getItem('studioSaved') || '[]'));
let favorites = migrateGalleryEntries(JSON.parse(localStorage.getItem('studioFavs') || '[]'));
let sessionImages = [];
let currentGalleryImages = [];
let historyItems = [];
let currentGallery = 'saved';
let lastResultUrl = null;
let collapsedSections = {};

// 생성 카운터
$('genCount').textContent = genCount;

function initUI() { renderPresets(); renderModelSelect(); renderSaved(); renderHistory(); }

function renderModelSelect() {
  $('modelSelect').innerHTML = Object.entries(MODELS).map(([key, m]) =>
    `<option value="${key}"${key === selectedModel ? ' selected' : ''}>${m.label}</option>`
  ).join('');
  updateModelBadge();
}
function onModelChange() {
  selectedModel = $('modelSelect').value;
  localStorage.setItem('selectedModel', selectedModel);
  updateModelBadge();
}
function updateModelBadge() {
  $('modelBadge').textContent = MODELS[selectedModel].label;
}

function renderPresetFilter() {
  const cats = Array.from(new Set(customPresets.map(p => p.category).filter(Boolean)));
  const el = $('presetFilter');
  if (!cats.length) { el.innerHTML = ''; return; }
  const chips = ['전체', ...cats].map(c =>
    `<button class="preset-filter-chip${c===presetFilter?' on':''}" onclick="selPresetFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`
  ).join('');
  el.innerHTML = chips;
}
function selPresetFilter(cat) { presetFilter = cat; renderPresetFilter(); renderPresets(); }

function renderPresets() {
  const addTile = `<button class="preset-btn add-tile" onclick="openPresetForm()">
    <div class="preset-thumb-ph">＋</div>
    <span class="preset-btn-label">프리셋 추가</span>
  </button>`;
  const visible = presetFilter === '전체' ? customPresets : customPresets.filter(p => p.category === presetFilter);
  const items = visible.map(p => {
    const safeTag = p.tag.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    const desc = p.tag.replace(/'/g, '');
    const safeName = p.name.replace(/'/g, '');
    const thumbHtml = p.thumb
      ? `<img class="preset-thumb" src="${p.thumb}">`
      : `<div class="preset-thumb-ph">🖼</div>`;
    const catLabel = p.category ? `<span class="preset-tag-label">${p.category}</span>` : '';
    return `<button class="preset-btn${selectedTags.has(p.tag)?' on':''}"
      onclick="selPreset('${safeTag}',this)"
      onmouseenter="showPoseTip(event,'${safeName}','${desc}')"
      onmouseleave="hidePoseTip()"
    >${thumbHtml}${catLabel}<span class="preset-btn-label">${p.name}</span><span class="preset-del" onclick="event.stopPropagation();deletePreset('${p.id}')">×</span></button>`;
  }).join('');
  $('presets').innerHTML = addTile + items;
  if (!visible.length) {
    $('presets').insertAdjacentHTML('beforeend', '<div style="color:var(--muted);font-size:12px;align-self:center;margin-left:6px">해당하는 프리셋이 없습니다</div>');
  }
  renderPresetFilter();
}

// 프리셋 추가 모달
// fromCurrent: true면 지금 화면에 입력된 프롬프트/방금 생성된 결과 이미지를 그대로 가져와 채워줌
function openPresetForm(fromCurrent) {
  presetThumbData = null;
  $('presetFormName').value = '';
  $('presetFormCategory').value = '';
  $('presetFormTag').value = fromCurrent ? buildPrompt() : '';
  if (fromCurrent && lastResultUrl) {
    presetThumbData = lastResultUrl;
    $('presetFormThumbPreview').src = presetThumbData;
    $('presetFormThumbPreview').style.display = 'block';
    $('presetFormThumbPh').style.display = 'none';
  } else {
    $('presetFormThumbPreview').style.display = 'none';
    $('presetFormThumbPh').style.display = 'flex';
  }
  $('presetModal').classList.add('on');
}
function closePresetForm() { $('presetModal').classList.remove('on'); }
function loadPresetThumb(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    presetThumbData = e.target.result;
    $('presetFormThumbPreview').src = presetThumbData;
    $('presetFormThumbPreview').style.display = 'block';
    $('presetFormThumbPh').style.display = 'none';
  };
  reader.readAsDataURL(file);
}
function savePreset() {
  const name = $('presetFormName').value.trim();
  const category = $('presetFormCategory').value.trim();
  const tag = $('presetFormTag').value.trim();
  if (!name || !tag) { alert('이름과 프롬프트를 입력해주세요'); return; }
  customPresets.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name, category, tag, thumb: presetThumbData
  });
  localStorage.setItem('customPresets', JSON.stringify(customPresets));
  closePresetForm();
  renderPresets();
}
function deletePreset(id) {
  const idx = customPresets.findIndex(p => p.id === id);
  if (idx < 0) return;
  selectedTags.delete(customPresets[idx].tag);
  customPresets.splice(idx, 1);
  localStorage.setItem('customPresets', JSON.stringify(customPresets));
  renderPresets();
  updatePromptPreview();
}

function showPoseTip(e, label, desc) {
  const t = $('poseTooltip');
  $('tooltipLabel').textContent = label;
  $('tooltipDesc').textContent = desc;
  t.classList.add('on');
  moveTip(e);
}
function moveTip(e) {
  const t = $('poseTooltip');
  const x = e.clientX + 14;
  const y = e.clientY - 80;
  t.style.left = Math.min(x, window.innerWidth - 130) + 'px';
  t.style.top = Math.max(y, 8) + 'px';
}
function hidePoseTip() {
  $('poseTooltip').classList.remove('on');
}
document.addEventListener('mousemove', e => {
  if ($('poseTooltip').classList.contains('on')) moveTip(e);
});
function selPreset(tag, el) {
  if (selectedTags.has(tag)) { selectedTags.delete(tag); el.classList.remove('on'); }
  else { selectedTags.add(tag); el.classList.add('on'); }
  updatePromptPreview();
}

function updatePromptPreview() {
  const chips = $('promptChips');
  const empty = $('chipsEmpty');
  if (selectedTags.size === 0) {
    chips.innerHTML = '<span class="prompt-chips-empty" id="chipsEmpty">선택된 태그 없음</span>';
    return;
  }
  chips.innerHTML = Array.from(selectedTags).map(tag => {
    const label = findLabel(tag);
    return `<span class="chip"><span>${label}</span><button class="chip-x" onclick="removeTag('${tag.replace(/'/g,"\\'")}')">×</button></span>`;
  }).join('');
}

function findLabel(tag) {
  const found = customPresets.find(p => p.tag === tag);
  return found ? found.name : tag.split(',')[0].trim();
}

function removeTag(tag) {
  selectedTags.delete(tag);
  // 프리셋 버튼 상태도 업데이트
  document.querySelectorAll('.preset-btn').forEach(btn => {
    if (btn.getAttribute('onclick')?.includes(tag.replace(/'/g,"\\'"))) {
      btn.classList.remove('on');
    }
  });
  updatePromptPreview();
}

// 업로드
function loadImg(input, idx) {
  const file = input.files[0]; if (!file) return;
  readFile(file, idx);
}
function readFile(file, idx) {
  const reader = new FileReader();
  reader.onload = e => {
    faceDataUrls[idx] = e.target.result;
    $('facePreview' + idx).src = e.target.result;
    $('facePreview' + idx).style.display = 'block';
    $('uploadPh' + idx).style.display = 'none';
    const inp = $('faceBox' + idx).querySelector('input[type=file]');
    if (inp) inp.value = '';
  };
  reader.readAsDataURL(file);
}

// 드래그앤드롭 - 두 슬롯
[0, 1].forEach(idx => {
  const box = $('faceBox' + idx);
  box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drag-over'); });
  box.addEventListener('dragleave', () => box.classList.remove('drag-over'));
  box.addEventListener('drop', e => {
    e.preventDefault(); box.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) readFile(file, idx);
  });
});

// 클립보드 붙여넣기 - 빈 슬롯에 순서대로
document.addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const idx = faceDataUrls[0] ? 1 : 0;
      readFile(item.getAsFile(), idx);
      break;
    }
  }
});

// 배치


// 시드
function randomSeed() { $('seedInput').value = Math.floor(Math.random() * 2147483647); }
function resetGenCount() {
  if (!confirm('생성 횟수를 0으로 초기화할까요?')) return;
  genCount = 0;
  localStorage.setItem('genCount', 0);
  $('genCount').textContent = 0;
}

// 슬롯
function setSlotStatus(idx, msg, pct) {
  const slot = $('slot' + idx);
  const p = pct !== undefined ? pct : 0;
  slot.innerHTML = `
    <div class="slot-status-wrap">
      <div class="slot-status">${msg}</div>
      <div class="slot-pct">${p}%</div>
    </div>
    <div class="slot-progress"><div class="slot-progress-fill" id="fill${idx}" style="width:${p}%"></div></div>`;
}
function setSlotPct(idx, pct, msg) {
  const fill = $('fill' + idx);
  if (fill) fill.style.width = pct + '%';
  const pctEl = $('slot' + idx).querySelector('.slot-pct');
  if (pctEl) pctEl.textContent = pct + '%';
  const statusEl = $('slot' + idx).querySelector('.slot-status');
  if (statusEl && msg) statusEl.textContent = msg;
}
function setSlotImg(idx, url, prompt) {
  lastResultUrl = url;
  const slot = $(`slot${idx}`);
  const img = document.createElement('img');
  img.src = url; img.onclick = () => openZoom(url);
  const acts = document.createElement('div'); acts.className = 'slot-actions';

  const dlB = document.createElement('button'); dlB.className = 'slot-btn'; dlB.textContent = '다운로드';
  dlB.onclick = e => { e.stopPropagation(); dl(url); };
  const useB = document.createElement('button'); useB.className = 'slot-btn primary'; useB.textContent = '원본으로';
  useB.onclick = e => { e.stopPropagation(); useAsSource(url); };
  const cmpB = document.createElement('button'); cmpB.className = 'slot-btn'; cmpB.textContent = '비교';
  cmpB.onclick = e => { e.stopPropagation(); showCompare(url, idx); };
  const favB = document.createElement('button'); favB.className = 'slot-btn'; favB.textContent = '⭐';
  favB.onclick = e => { e.stopPropagation(); toggleFav(url, prompt); };

  acts.appendChild(dlB); acts.appendChild(useB); acts.appendChild(cmpB); acts.appendChild(favB);
  slot.innerHTML = ''; slot.appendChild(img); slot.appendChild(acts);
  saveImage(url, prompt);
}

function dl(url) {
  fetch(url).then(r=>r.blob()).then(blob=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'studio_' + Date.now() + '.png'; a.click();
  }).catch(()=> window.open(url, '_blank'));
}
function openZoom(url) {
  $('zoomImg').src = '';
  setTimeout(() => { $('zoomImg').src = url; }, 10);
  $('zoomOverlay').classList.add('on');
}
function closeZoom() { $('zoomOverlay').classList.remove('on'); $('zoomImg').src = ''; }
function useAsSource(url, idx) {
  idx = idx !== undefined ? idx : (faceDataUrls[0] ? 1 : 0);
  idx = Math.min(idx, 1);
  fetch(url).then(r=>r.blob()).then(blob=>{
    const reader = new FileReader();
    reader.onload = e => {
      faceDataUrls[idx] = e.target.result;
      $('facePreview' + idx).src = e.target.result;
      $('facePreview' + idx).style.display = 'block';
      $('uploadPh' + idx).style.display = 'none';
    };
    reader.readAsDataURL(blob);
  }).catch(()=>{
    faceDataUrls[idx] = url;
    $('facePreview' + idx).src = url;
    $('facePreview' + idx).style.display = 'block';
    $('uploadPh' + idx).style.display = 'none';
  });
}

// 비교 뷰
function showCompare(resultUrl, idx) {
  const cs = $('compareSection');
  $('compareOriginal').src = (idx !== undefined ? faceDataUrls[idx] : faceDataUrls[0]) || '';
  $('compareResult').src = resultUrl;
  cs.style.display = cs.style.display === 'none' ? 'block' : 'none';
}

// 즐겨찾기
function toggleFav(url, prompt) {
  const idx = favorites.findIndex(f => f.url === url);
  if (idx >= 0) favorites.splice(idx, 1);
  else favorites.unshift({ url, prompt: prompt || '' });
  localStorage.setItem('studioFavs', JSON.stringify(favorites));
  renderSaved();
}

// 섹션 토글
function toggleSection(id) {
  const body = document.getElementById(id + '-body');
  const arrow = document.getElementById(id + '-arrow');
  const toggle = arrow.closest('.section-toggle');
  collapsedSections[id] = !collapsedSections[id];
  body.style.display = collapsedSections[id] ? 'none' : 'block';
  toggle.classList.toggle('collapsed', collapsedSections[id]);
}

// 갤러리
function switchGallery(tab) {
  currentGallery = tab;
  ['saved','session','favorites'].forEach(t => $(`gtab-${t}`).classList.toggle('on', t===tab));
  renderSaved();
}
function renderSaved() {
  const grid = $('savedGrid');
  const images = currentGallery === 'session' ? sessionImages :
                 currentGallery === 'favorites' ? favorites : savedImages;
  currentGalleryImages = images;
  if (!images.length) {
    grid.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:20px 0">이미지가 없습니다</div>`;
    return;
  }
  grid.innerHTML = images.map((entry, i) => {
    const isFav = favorites.some(f => f.url === entry.url);
    return `<div class="gallery-item${isFav?' favorited':''}" data-idx="${i}">
      <img src="${entry.url}">
      <button class="fav-btn" data-action="fav">${isFav?'⭐':'☆'}</button>
      <div class="gallery-overlay">
        <button class="gi-btn primary" data-action="use">원본으로</button>
        ${entry.prompt ? `<button class="gi-btn" data-action="reuse">프롬프트</button>` : ''}
        <button class="gi-btn" data-action="dl">다운로드</button>
        ${currentGallery !== 'session' ? `<button class="gi-btn danger" data-action="del">삭제</button>` : ''}
      </div>
    </div>`;
  }).join('');
}
// 그리드 전체에 이벤트 위임 — url/prompt에 따옴표가 섞여도 안전하고, 오버레이가 클릭을 가로채는 문제도 없음
$('savedGrid').addEventListener('click', e => {
  const item = e.target.closest('.gallery-item');
  if (!item) return;
  const entry = currentGalleryImages[parseInt(item.dataset.idx, 10)];
  if (!entry) return;
  const btn = e.target.closest('button');
  if (btn) {
    const action = btn.dataset.action;
    if (action === 'fav') {
      toggleFav(entry.url, entry.prompt);
    } else if (action === 'use') {
      useAsSource(entry.url);
    } else if (action === 'reuse') {
      $('prompt').value = entry.prompt || '';
    } else if (action === 'dl') {
      dl(entry.url);
    } else if (action === 'del') {
      deleteGallery(parseInt(item.dataset.idx, 10));
    }
    return;
  }
  if (e.target.tagName === 'IMG') openZoom(entry.url);
});
function saveImage(url, prompt) {
  const entry = { url, prompt: prompt || '' };
  sessionImages.unshift(entry);
  savedImages.unshift(entry);
  if (savedImages.length > 100) savedImages = savedImages.slice(0, 100);
  localStorage.setItem('studioSaved', JSON.stringify(savedImages));
  renderSaved();
}
function deleteGallery(idx) {
  if (currentGallery === 'favorites') { favorites.splice(idx,1); localStorage.setItem('studioFavs',JSON.stringify(favorites)); }
  else { savedImages.splice(idx,1); localStorage.setItem('studioSaved',JSON.stringify(savedImages)); }
  renderSaved();
}
function clearSaved() {
  if(!confirm('전체 삭제?')) return;
  if (currentGallery === 'favorites') { favorites=[]; localStorage.setItem('studioFavs','[]'); }
  else if (currentGallery === 'session') { sessionImages=[]; }
  else { savedImages=[]; localStorage.setItem('studioSaved','[]'); }
  renderSaved();
}

// 히스토리
function addHistory(prompt, resultUrl) {
  historyItems.unshift({ prompt, resultUrl, time: new Date().toLocaleTimeString() });
  if (historyItems.length > 20) historyItems = historyItems.slice(0, 20);
  renderHistory();
}
function renderHistory() {
  const list = $('historyList');
  if (!historyItems.length) { list.innerHTML = '<div style="color:var(--muted);font-size:13px">히스토리가 없습니다</div>'; return; }
  list.innerHTML = historyItems.map((h, i) => `
    <div class="history-item" onclick="reuseHistory(${i})">
      <img class="history-thumb" src="${h.resultUrl}" onerror="this.style.display='none'" onclick="event.stopPropagation();openZoom('${h.resultUrl}')">
      <div class="history-info">
        <div class="history-tags">${h.prompt || '(프롬프트 없음)'}</div>
        <div class="history-meta">${h.time}</div>
      </div>
      <button class="history-reuse" onclick="event.stopPropagation();reuseHistory(${i})">재사용</button>
    </div>`).join('');
}
function reuseHistory(idx) {
  const h = historyItems[idx];
  $('prompt').value = h.prompt;
}

// API
async function pollJob(taskId, idx, prompt) {
  let failCount = 0;
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 3000));
    const pct = Math.min(10 + i * 3, 90);
    let data;
    try {
      const res = await fetch(`/api/proxy/v1/images/generations/async/${taskId}`, {
        headers: { 'Authorization': `Bearer ${API_KEY}` }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
    } catch (e) {
      failCount++;
      if (failCount >= 5) {
        setSlotStatus(idx, '연결 오류 반복 — 잠시 후 다시 시도해주세요', 0);
        return null;
      }
      setSlotPct(idx, pct, '일시적 오류, 재시도 중...');
      continue; // 이번 폴링만 건너뛰고 루프는 계속 진행
    }
    failCount = 0;
    const status = data.data?.status || '';
    if (status === 'SUCCESS') {
      setSlotPct(idx, 100, '완료');
      await new Promise(r => setTimeout(r, 300));
      const url = data.data?.outputs?.[0];
      if (url) setSlotImg(idx, url, prompt);
      else setSlotStatus(idx, 'URL 없음', 100);
      return url || null;
    } else if (status === 'FAILURE') {
      setSlotStatus(idx, '실패: ' + (data.data?.fail_reason || '알 수 없음'), 0);
      return null;
    }
    setSlotPct(idx, pct, status === 'IN_PROGRESS' ? '생성 중...' : '대기 중...');
  }
  setSlotStatus(idx, '타임아웃', 0);
  return null;
}

async function runJob(prompt, faceUrl, idx, seed, modelId) {
  setSlotStatus(idx, '요청 중...', 5);
  try {
    const body = { model: modelId, prompt: prompt || 'photorealistic', size: '1664x2498' };
    if (faceUrl) body.images = [faceUrl];
    if (seed) body.seed = parseInt(seed);
    const res = await fetch('/api/proxy/v1/images/generations/async', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    const taskId = data.task_id || data.id || data.data?.task_id;
    if (taskId) return await pollJob(taskId, idx, prompt);
    setSlotStatus(idx, '에러: ' + JSON.stringify(data).slice(0, 150));
    return null;
  } catch(e) { setSlotStatus(idx, '에러: ' + e.message); return null; }
}

function buildPrompt() {
  const tags = Array.from(selectedTags).join(', ');
  const extra = $('prompt').value.trim();
  return [tags, extra].filter(Boolean).join(', ') || 'photorealistic, high quality';
}

// 슬롯별 완전히 독립된 생성 큐 — 서로의 진행 상태에 영향을 주지 않음
async function generateSlot(idx) {
  const model = MODELS[selectedModel];
  const url = faceDataUrls[idx];
  if (model.needsImage && !url) { alert(`이미지 ${idx + 1}을(를) 업로드해주세요`); return; }
  const prompt = buildPrompt();
  const seed = $('seedInput').value.trim();
  const btn = $('genBtn' + idx);
  if (btn.disabled) return; // 이미 이 슬롯에서 진행 중
  btn.disabled = true; btn.textContent = '생성 중...';

  const resultUrl = await runJob(prompt, model.needsImage ? url : null, idx, seed, model.id);
  if (resultUrl) {
    addHistory(prompt, resultUrl);
    genCount += 1;
    localStorage.setItem('genCount', genCount);
    $('genCount').textContent = genCount;
  }

  btn.disabled = false; btn.textContent = `✦ 생성 ${idx + 1}`;
}

// 두 슬롯을 각자 독립적으로(서로 기다리지 않고) 동시에 실행
function generateBoth() {
  const model = MODELS[selectedModel];
  if (!model.needsImage) { generateSlot(0); generateSlot(1); return; }
  if (faceDataUrls[0]) generateSlot(0);
  if (faceDataUrls[1]) generateSlot(1);
  if (!faceDataUrls[0] && !faceDataUrls[1]) alert('이미지를 업로드해주세요');
}

initUI();
</script>
