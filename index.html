<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1a1a24;
  --border: #ffffff0f;
  --border2: #ffffff18;
  --text: #e8e8f0;
  --muted: #6b6b80;
  --accent: #a855f7;
  --accent2: #7c3aed;
  --accent-glow: rgba(168,85,247,0.3);
  --pink: #ec4899;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}

/* ── 헤더 ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,15,0.8);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-size: 18px;
  font-weight: 600;
  background: linear-gradient(135deg, #a855f7, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.02em;
}
.header-right { display: flex; align-items: center; gap: 12px; }
.credit-badge {
  font-size: 12px;
  color: var(--muted);
  background: var(--surface2);
  border: 1px solid var(--border2);
  padding: 4px 10px;
  border-radius: 20px;
}

/* ── 메인 레이아웃 ── */
.container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }

/* ── 생성 영역 ── */
.creator-section {
  padding: 28px 0 20px;
  border-bottom: 1px solid var(--border);
}

.creator-grid {
  display: grid;
  grid-template-columns: 240px 1fr 200px;
  gap: 16px;
  align-items: start;
}

/* 업로드 */
.upload-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  aspect-ratio: 3/4;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s;
}
.upload-card:hover { border-color: var(--accent); }
.upload-card input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-card img { width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0; display: none; background: #000; }
.upload-ph { text-align: center; color: var(--muted); font-size: 13px; z-index: 1; }
.upload-ph .icon {
  width: 48px; height: 48px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  margin: 0 auto 10px;
}
.upload-ph p { font-size: 12px; margin-top: 4px; }

/* 중앙 설정 */
.creator-center {}

/* 카테고리 탭 */
.cat-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.cat-tab {
  padding: 6px 14px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px solid var(--border2);
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.cat-tab:hover { color: var(--text); border-color: var(--border2); }
.cat-tab.on {
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border-color: transparent;
  color: #fff;
}

/* 프리셋 버튼들 */
.preset-wrap {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 14px;
  min-height: 120px;
}
.preset-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.preset-btn {
  padding: 6px 12px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  font-size: 12px;
  color: #888;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
}
.preset-btn:hover { border-color: var(--accent); color: var(--text); }
.preset-btn.on {
  background: rgba(168,85,247,0.15);
  border-color: var(--accent);
  color: #c084fc;
}

/* 프롬프트 */
.prompt-area {
  margin-top: 12px;
  position: relative;
}
textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  resize: none;
  min-height: 80px;
  line-height: 1.5;
  transition: border-color 0.15s;
}
textarea:focus { outline: none; border-color: var(--accent); }
::placeholder { color: var(--muted); }

/* 오른쪽 버튼 영역 */
.creator-right { display: flex; flex-direction: column; gap: 10px; }

.batch-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.batch-btn {
  padding: 8px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
  text-align: center;
}
.batch-btn.on {
  background: rgba(168,85,247,0.15);
  border-color: var(--accent);
  color: #c084fc;
}

.gen-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border: none;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.15s, transform 0.1s;
  box-shadow: 0 4px 20px var(--accent-glow);
}
.gen-btn:hover { opacity: 0.9; transform: translateY(-1px); }
.gen-btn:active { transform: translateY(0); }
.gen-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ── 결과 슬롯 ── */
.result-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}
.slot {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  min-height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.slot img { width: 100%; display: block; cursor: zoom-in; border-radius: 14px; }
.slot-empty { color: var(--border2); font-size: 13px; }
.slot-status { font-size: 12px; color: var(--muted); padding: 12px; text-align: center; }
.slot-actions {
  position: absolute; bottom: 10px; left: 0; right: 0;
  display: none; justify-content: center; gap: 8px; padding: 0 12px;
}
.slot:hover .slot-actions { display: flex; }
.slot-btn {
  padding: 6px 14px; border-radius: 8px; font-size: 12px;
  cursor: pointer; font-family: inherit; backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.7); color: #ddd; transition: all 0.12s;
}
.slot-btn.primary {
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border-color: transparent; color: #fff;
}

/* ── 갤러리 ── */
.gallery-section { padding: 24px 0; }
.gallery-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.gallery-title { font-size: 14px; font-weight: 500; color: var(--text); }
.clear-btn {
  font-size: 12px; color: var(--muted); background: none;
  border: 1px solid var(--border2); padding: 4px 12px;
  border-radius: 6px; cursor: pointer; font-family: inherit;
  transition: all 0.12s;
}
.clear-btn:hover { color: #f87171; border-color: rgba(248,113,113,0.4); }

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}
.gallery-item {
  border-radius: 10px; overflow: hidden;
  aspect-ratio: 2/3; background: var(--surface);
  border: 1px solid var(--border); position: relative; cursor: zoom-in;
}
.gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-item-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 50%);
  opacity: 0; transition: opacity 0.15s;
  display: flex; flex-direction: column;
  justify-content: flex-end; padding: 10px; gap: 5px;
}
.gallery-item:hover .gallery-item-overlay { opacity: 1; }
.gi-btn {
  width: 100%; padding: 5px 8px; border-radius: 6px;
  font-size: 11px; cursor: pointer; font-family: inherit;
  text-align: center; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.5); color: #ddd; transition: all 0.12s;
}
.gi-btn.primary {
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border-color: transparent; color: #fff;
}

/* ── 줌 ── */
.zoom-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.96); z-index: 9999;
  align-items: center; justify-content: center; cursor: zoom-out;
}
.zoom-overlay.on { display: flex; }
.zoom-overlay img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 12px; }

.gallery-tab {
  padding: 6px 16px;
  background: none;
  border: 1px solid var(--border2);
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
}
.gallery-tab:first-child { border-radius: 8px 0 0 8px; }
.gallery-tab:last-child { border-radius: 0 8px 8px 0; border-left: none; }
.gallery-tab.on { background: rgba(168,85,247,0.15); border-color: var(--accent); color: #c084fc; }
</style>
</head>

    { label: '새벽감성', tag: 'late night mood, dim ambient light, intimate atmosphere' },
  ],
};

let selectedTags = new Set(), batchCount = 1, faceDataUrl = null, activeTab = '서기';

function initUI() { renderTabs(); renderPresets(activeTab); }
function renderTabs() {
  $('tabs').innerHTML = Object.keys(CATS).map(t =>
    `<button class="cat-tab${t===activeTab?' on':''}" onclick="selTab('${t}')">${t}</button>`
  ).join('');
}
function selTab(t) { activeTab = t; renderTabs(); renderPresets(t); }
function renderPresets(tab) {
  $('presets').innerHTML = CATS[tab].map(p =>
    `<button class="preset-btn${selectedTags.has(p.tag)?' on':''}" onclick="selPreset('${p.tag.replace(/'/g,"\\'")}',this)">${p.label}</button>`
  ).join('');
}
function selPreset(tag, el) {
  if (selectedTags.has(tag)) { selectedTags.delete(tag); el.classList.remove('on'); }
  else { selectedTags.add(tag); el.classList.add('on'); }
}
function loadImg(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    faceDataUrl = e.target.result;
    $('facePreview').src = faceDataUrl; $('facePreview').style.display = 'block';
    $('uploadPh').style.display = 'none';
  };
  reader.readAsDataURL(file);
}
function setBatch(n) {
  batchCount = n;
  $('b1').classList.toggle('on', n===1); $('b2').classList.toggle('on', n===2);
  $('slot1').style.display = n===2 ? 'block' : 'none';
}
function setSlotStatus(idx, msg) {
  $(`slot${idx}`).innerHTML = `<div class="slot-status">${msg}</div>`;
}
function setSlotImg(idx, url) {
  const slot = $(`slot${idx}`);
  const img = document.createElement('img');
  img.src = url; img.onclick = () => openZoom(url);
  const acts = document.createElement('div'); acts.className = 'slot-actions';
  const dlB = document.createElement('button'); dlB.className = 'slot-btn'; dlB.textContent = '다운로드';
  dlB.onclick = e => { e.stopPropagation(); dl(url); };
  const useB = document.createElement('button'); useB.className = 'slot-btn primary'; useB.textContent = '원본으로';
  useB.onclick = e => { e.stopPropagation(); useAsSource(url); };
  acts.appendChild(dlB); acts.appendChild(useB);
  slot.innerHTML = ''; slot.appendChild(img); slot.appendChild(acts);
  saveImage(url);
}
function dl(url) {
  fetch(url)
    .then(r => r.blob())
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'studio_' + Date.now() + '.png';
      a.click();
    })
    .catch(() => window.open(url, '_blank'));
}
function openZoom(url) { $('zoomImg').src = url; $('zoomOverlay').classList.add('on'); }
function closeZoom() { $('zoomOverlay').classList.remove('on'); }
function useAsSource(url) {
  fetch(url).then(r=>r.blob()).then(blob=>{
    const reader = new FileReader();
    reader.onload = e => {
      faceDataUrl = e.target.result;
      $('facePreview').src = faceDataUrl; $('facePreview').style.display = 'block';
      $('uploadPh').style.display = 'none';
    };
    reader.readAsDataURL(blob);
  }).catch(()=>{ faceDataUrl = url; $('facePreview').src = url; $('facePreview').style.display = 'block'; $('uploadPh').style.display = 'none'; });
}

// 갤러리
let savedImages = JSON.parse(localStorage.getItem('studioSaved') || '[]');
let sessionImages = [];
let currentGallery = 'saved';

function switchGallery(tab) {
  currentGallery = tab;
  document.getElementById('gtab-saved').classList.toggle('on', tab === 'saved');
  document.getElementById('gtab-session').classList.toggle('on', tab === 'session');
  renderSaved();
}
function renderSaved() {
  const grid = $('savedGrid');
  const images = currentGallery === 'session' ? sessionImages : savedImages;
  if (!images.length) {
    grid.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:20px 0">${currentGallery === 'session' ? '이번 세션에 생성된 이미지가 없습니다' : '아직 저장된 이미지가 없습니다'}</div>`;
    return;
  }
  grid.innerHTML = images.map((url, i) => `
    <div class="gallery-item">
      <img src="${url}" onclick="openZoom('${url}')">
      <div class="gallery-item-overlay">
        <button class="gi-btn primary" onclick="useAsSource('${url}')">원본으로</button>
        <button class="gi-btn" onclick="dl('${url}')">다운로드</button>
        ${currentGallery === 'saved' ? `<button class="gi-btn" onclick="deleteSaved(${i})" style="color:#f87171">삭제</button>` : ''}
      </div>
    </div>`).join('');
}
function saveImage(url) {
  sessionImages.unshift(url);
  savedImages.unshift(url);
  if (savedImages.length > 50) savedImages = savedImages.slice(0, 50);
  localStorage.setItem('studioSaved', JSON.stringify(savedImages));
  renderSaved();
}
function deleteSaved(idx) { savedImages.splice(idx,1); localStorage.setItem('studioSaved',JSON.stringify(savedImages)); renderSaved(); }
function clearSaved() { if(!confirm('전체 삭제?')) return; savedImages=[]; localStorage.setItem('studioSaved','[]'); renderSaved(); }

// API
async function pollJob(taskId, idx) {
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 3000));
    const res = await fetch(`/api/proxy/v1/images/generations/async/${taskId}`, {
      headers: { 'Authorization': `Bearer ${API_KEY}` }
    });
    const data = await res.json();
    const status = data.data?.status || '';
    if (status === 'SUCCESS') {
      const url = data.data?.outputs?.[0];
      if (url) setSlotImg(idx, url);
      else setSlotStatus(idx, 'URL 없음');
      return;
    } else if (status === 'FAILURE') {
      setSlotStatus(idx, '실패: ' + (data.data?.fail_reason || '알 수 없음'));
      return;
    }
    setSlotStatus(idx, `생성 중...`);
  }
  setSlotStatus(idx, '타임아웃');
}
async function runJob(prompt, faceUrl, idx) {
  setSlotStatus(idx, '요청 중...');
  try {
    const res = await fetch('/api/proxy/v1/images/generations/async', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'bytedance/seedream-5.0-pro-i2i-spicy', prompt, images: [faceUrl], size: '1664x2498' })
    });
    const data = await res.json();
    const taskId = data.task_id || data.id || data.data?.task_id;
    if (taskId) await pollJob(taskId, idx);
    else setSlotStatus(idx, '에러: ' + JSON.stringify(data).slice(0, 150));
  } catch(e) { setSlotStatus(idx, '에러: ' + e.message); }
}
async function generate() {
  if (!faceDataUrl) { alert('이미지를 업로드해주세요'); return; }
  const tags = Array.from(selectedTags).join(', ');
  const extra = $('prompt').value.trim();
  const prompt = [tags, extra].filter(Boolean).join(', ');
  const btn = $('genBtn'); btn.disabled = true; btn.textContent = '생성 중...';
  const jobs = [];
  for (let i = 0; i < batchCount; i++) jobs.push(runJob(prompt, faceDataUrl, i));
  await Promise.all(jobs);
  btn.disabled = false; btn.textContent = '✦ 생성';
}

initUI(); renderSaved();
</script>
